# @dsh-remote/bundle-daemon-tui — dsh profile bundle layer ("daemon mode",
# in-process TUI side).
#
# Makes a seam-compliant in-process TUI (one that talks only to the official
# dsh session seams — ctx.sessions / ctx.agents / ctx.sessionPersistence)
# run against a headless dsh on a remote Linux host: the sessions, agent
# loop, LLM calls and the execution world all live inside the remote host;
# the local process renders the frontend. Remote approval/question requests
# are bridged back into the LOCAL ctx.approval / ctx.userQuestions services,
# so the frontend's existing answerers render them unmodified.
#
# Applied after @deepseek-ai/dsh-base in the profile's bundle stack. Patch
# semantics (dsh profile composer): an id-targeted patch replaces the row's
# whole `config`/flags but CANNOT change the row's plugin `name` (a `name`
# mismatch skips the patch with a warning), so swapping a provider means
# disabling the base row and inserting a new one. `!!js` expressions evaluate
# against the entry's cordis context.
#
# Ordering: the composer applies layers sequentially and this layer must come
# AFTER dsh-base (it disables dsh-base rows by id). Within the layer the
# disables are stated before the inserts so a reader sees the swap; row order
# itself carries no load semantics (activation is service-availability
# driven).
#
# The local execution world (fs-sandbox, subprocess, sandboxes) is left
# untouched: in daemon mode execution happens inside the remote host, never
# rerouted from the local process. Rows that merely INJECT sessions/agents
# (session-title, agent-loop, session-query, subagent, …) also stay — the
# proxy re-provides the same service keys, remote-backed.

# dsh-base row `session` (@deepseek-ai/dsh-session): the local ctx.sessions
# store. Disabled; remote-proxy takes over the `sessions` service key with a
# remote-backed implementation.
- id: session
  name: '@deepseek-ai/dsh-session'
  disabled: true

# dsh-base row `agent` (@deepseek-ai/dsh-agent): the local ctx.agents
# registry. Disabled; remote-proxy takes over the `agents` service key.
- id: agent
  name: '@deepseek-ai/dsh-agent'
  disabled: true

# dsh-base row `session-persistence-jsonl`
# (@deepseek-ai/dsh-session-persistence-jsonl): the local ctx.sessionPersistence
# backend (append-only JSONL logs under $DSH_HOME). Disabled; remote-proxy
# takes over the `sessionPersistence` service key. Session logs then live only
# on the remote host — nothing session-shaped is written to the local disk.
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  disabled: true

- insert:
    # Connection owner (ssh2). Each daemon target must carry a
    # `pairingTokenRef`; the shipped default resolves it as the name of an
    # environment variable holding the pairing token (see remote-daemon
    # below). Restate this row's WHOLE config in your profile
    # cordis.patch.yml to pin real hosts — patching replaces, never merges.
    # If you rename the target id, also restate the remote-proxy row — its
    # `targetId` references the id 'default'.
    - id: remote-ssh
      name: '@dsh-remote/remote-ssh'
      config:
        targets:
          - id: default
            pairingTokenRef: DSH_REMOTE_TOKEN
            ssh:
              host: !!js "process.env.DSH_REMOTE_HOST ?? 'localhost'"
              port: !!js "Number(process.env.DSH_REMOTE_PORT ?? 22)"
              username: !!js "process.env.DSH_REMOTE_USER ?? process.env.USER ?? 'root'"
              auth: { type: agent }

    # ctx.remoteSessions: session list/attach/prompt/cancel/fork over the
    # daemon protocol, with exclusive-write leases and seq-cursor resume.
    # `!!js` evaluates against the entry's cordis context.
    - id: remote-daemon
      name: '@dsh-remote/remote-daemon'
      config:
        resolveToken: !!js "async (ref) => { const token = process.env[ref]; if (!token) throw new Error(`pairing token env var not set: ${ref}`); return token; }"

    # The seam swap itself: remote-backed ctx.sessions / ctx.agents /
    # ctx.sessionPersistence driving the remote headless dsh through
    # ctx.remoteSessions (remote-daemon above), plus the bridges that relay
    # remote approval/question requests into the LOCAL ctx.approval /
    # ctx.userQuestions services (the dsh-base `approval` and `user-questions`
    # rows stay — frontend answerers render against them as usual).
    # `targetId` selects the remote-ssh target; 'default' is the plugin's own
    # default, restated here for documentation value.
    - id: remote-proxy
      name: '@dsh-remote/proxy'
      config:
        targetId: 'default'
